<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융한걸음 — 송금 연습</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">
<main id="phone">

  <div id="status-bar">
    <span id="status-time">9:41</span>
    <span id="status-icons">📶 📡 🔋</span>
  </div>

  <header id="app-header">
    <p id="app-title">금융한걸음</p>
    <p id="app-subtitle">AI와 함께 연습하는 모바일뱅킹</p>
    <p id="app-safety">교육용 연습 화면 · 실제 돈은 움직이지 않습니다</p>
  </header>

  <p id="progress" hidden></p>
  <button id="exit-to-home" data-goto="home" class="link-btn" hidden>← 처음으로</button>

  <section class="screen is-active" id="screen-intro">
    <h1>오늘의 미션</h1>
    <p id="intro-mission" class="mission-banner"></p>
    <button data-goto="home" class="primary">송금 연습 시작</button>
    <button id="quiz-start-intro" hidden><span class="btn-icon">📚</span>금융 용어 퀴즈</button>
  </section>

  <section class="screen" id="screen-home">
    <h1>내 계좌</h1>
    <div class="account-card">
      <p class="label-sm">출금계좌</p>
      <p class="account-no">한걸음은행 123456-78-901234</p>
      <p class="balance">잔액 <strong>1,250,000</strong> 원</p>
    </div>
    <button data-action="transfer" class="primary"><span class="btn-icon">💸</span>이체<small>돈 보내기</small></button>
    <button data-action="history"><span class="btn-icon">📋</span>거래내역<small>들어오고 나간 기록</small></button>
  </section>
  <section class="screen" id="screen-bank">
    <h1>어느 은행으로 보내나요?</h1>
    <button data-action="pick-bank" data-value="한걸음은행"><span class="btn-icon">🏦</span>한걸음은행</button>
    <button data-action="pick-bank" data-value="새봄은행"><span class="btn-icon">🏦</span>새봄은행</button>
    <button data-action="pick-bank" data-value="푸른은행"><span class="btn-icon">🏦</span>푸른은행</button>
  </section>

  <section class="screen" id="screen-account">
    <h1>계좌번호를 넣으세요</h1>
    <input id="input-account" type="text" inputmode="numeric" placeholder="숫자만 입력">
    <div class="keypad" data-target="input-account">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="clear">전체지움</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back">← 지움</button>
    </div>
    <button data-action="submit-account" class="primary">다음</button>
  </section>

  <section class="screen" id="screen-amount">
    <h1>얼마를 보내나요?</h1>
    <input id="input-amount" type="text" inputmode="numeric" placeholder="숫자만 입력">
    <div class="keypad" data-target="input-amount">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="clear">전체지움</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back">← 지움</button>
    </div>
    <button data-action="submit-amount" class="primary">다음</button>
  </section>

  <section class="screen" id="screen-confirm">
    <h1>이대로 보낼까요?</h1>
    <div class="account-card">
      <p class="hint">
        <span class="confirm-label">내 출금계좌</span> 한걸음은행 123456-78-901234<br>
        <span class="confirm-label">받는 계좌</span> 김민수 · <span id="confirm-bank"></span> <span id="confirm-account"></span><br>
        <span class="confirm-label">보낼 금액</span>
      </p>
      <p class="confirm-amount"><span id="confirm-amount"></span> 원</p>
    </div>
    <button data-action="confirm" class="primary"><span class="btn-icon">📤</span>보내기</button>
  </section>

  <section class="screen" id="screen-done">
    <h1>완료</h1>
    <div class="success-card">
      <p>송금 연습을 완료했어요.</p>
      <p>김민수님에게 <strong><span id="done-amount"></span> 원</strong>을 보냈습니다.</p>
      <p>실제 돈은 움직이지 않았습니다.</p>
    </div>
    <button data-action="restart" class="primary"><span class="btn-icon">🔄</span>다시 연습하기</button>
    <button id="quiz-start" hidden><span class="btn-icon">📚</span>용어 복습하기</button>
  </section>
  <section class="screen" id="screen-quiz"></section>

  <div id="help-bar">
    <button id="mic-button" hidden>🎤 말로 물어보기</button>
    <button id="help-ask">💬 AI 선생님에게 물어보기</button>
  </div>

  <div id="question-box" hidden>
    <button id="help-repeat">다시 설명해주세요</button>
    <div class="question-input-row">
      <input id="question-text" type="text" placeholder="궁금한 것을 적어 주세요">
      <button id="question-send">보내기</button>
    </div>
  </div>

  <p id="ai-answer"></p>
</main>
</div>

<script>
window.BankUI = (function () {
  // intro 는 미션 단계가 아니다(missions.json 에 없음) — quiz 와 같은 방식의 순수 화면 전환.
  var SCREENS = ['intro', 'home', 'bank', 'account', 'amount', 'confirm', 'done', 'quiz'];

  // F17 진행 표시. 문구는 missions.json 의 label 에서 온다 — 여기에 단계 이름을 적지 않는다.
  // done 은 label 이 있어도 세지 않는다 — 4차 UI 확정(SPEC 13.6)에서 "완료 화면엔 진행칸 안 보임"으로
  // 결정했다. missions.json 의 label 자체는 안 건드린다(그건 B 소관) — 화면 쪽 표시만 뺀다.
  function updateProgress(name) {
    var el = document.getElementById('progress');
    if (!el) return;
    var m = (window.MissionEngine && window.MissionEngine.getMission)
      ? window.MissionEngine.getMission() : null;
    var steps = (m && Array.isArray(m.steps)) ? m.steps : [];
    var labeled = steps.filter(function (s) { return s.label && s.step !== 'done'; });
    var idx = -1;
    labeled.forEach(function (s, i) { if (s.step === name) idx = i; });
    if (idx === -1) {              // home·done(진행칸 없음)·quiz(미션 아님)
      el.textContent = '';
      el.hidden = true;
      return;
    }
    el.hidden = false;
    el.textContent = (idx + 1) + ' / ' + labeled.length + ' 단계 — ' + labeled[idx].label;
  }

  // 4차 UI 확정: 인트로 화면에만 앱 이름·부제를 보여준다. 나머지 화면은 "한 화면 = 한 행동"으로
  // 반복 노출을 줄인다. 안전 문구(#app-safety)는 SOL 레퍼런스처럼 어느 화면에서나 그대로 둔다(13.3 R5).
  function updateHeader(name) {
    var title = document.getElementById('app-title');
    var subtitle = document.getElementById('app-subtitle');
    var isIntro = name === 'intro';
    if (title) title.hidden = !isIntro;
    if (subtitle) subtitle.hidden = !isIntro;
  }

  // 홈으로 돌아가는 링크. 상태머신(F7)엔 뒤로 가기 개념이 없어 "이전 단계"가 아니라
  // "처음 화면 보기"다 — 다시 데이터를 넣으면 원래 있던 단계에서 이어진다.
  function updateExitLink(name) {
    var el = document.getElementById('exit-to-home');
    if (!el) return;
    el.hidden = ['bank', 'account', 'amount', 'confirm'].indexOf(name) === -1;
  }

  function showStep(name) {
    if (SCREENS.indexOf(name) === -1) {
      console.warn('[BankUI] 모르는 화면:', name);
      return;
    }
    SCREENS.forEach(function (s) {
      var el = document.getElementById('screen-' + s);
      if (el) el.classList.toggle('is-active', s === name);
    });
    if (name === 'intro') {
      var el2 = document.getElementById('intro-mission');
      var m2 = (window.MissionEngine && window.MissionEngine.getMission)
        ? window.MissionEngine.getMission() : null;
      if (el2) el2.textContent = (m2 && m2.title) ? m2.title : '';
    }
    if (name === 'confirm' || name === 'done') fillMissionValues();
    updateProgress(name);
    updateHeader(name);
    updateExitLink(name);
  }

  // 계좌번호·금액·은행명은 missions.json 의 step value 에서 그대로 가져다 쓴다.
  // (수취인 이름은 스키마에 필드가 없어 하드코딩으로 남는다.)
  function fillMissionValues() {
    var m = (window.MissionEngine && window.MissionEngine.getMission)
      ? window.MissionEngine.getMission() : null;
    var steps = (m && Array.isArray(m.steps)) ? m.steps : [];
    function valueOf(step) {
      var found = steps.filter(function (s) { return s.step === step; })[0];
      return found ? found.value : '';
    }
    var bank = valueOf('bank');
    var account = valueOf('account');
    var amount = valueOf('amount');
    var amountFmt = amount ? Number(amount).toLocaleString('ko-KR') : '';

    var elBank = document.getElementById('confirm-bank');
    var elAccount = document.getElementById('confirm-account');
    var elConfirmAmount = document.getElementById('confirm-amount');
    var elDoneAmount = document.getElementById('done-amount');
    if (elBank) elBank.textContent = bank;
    if (elAccount) elAccount.textContent = account;
    if (elConfirmAmount) elConfirmAmount.textContent = amountFmt;
    if (elDoneAmount) elDoneAmount.textContent = amountFmt;
  }

  function showAnswer(text) {
    var box = document.getElementById('ai-answer');
    if (!box) return;
    box.textContent = text || '';
    box.classList.remove('is-error');
  }

  function showError(message, selector) {
    var box = document.getElementById('ai-answer');
    if (box) {
      box.textContent = message || '';
      box.classList.add('is-error');
    }
    var target = selector ? document.querySelector(selector) : null;
    if (!target) return;
    target.classList.remove('shake');
    void target.offsetWidth;   // 리플로우 강제 → 연속 오답에도 매번 흔들린다
    target.classList.add('shake');
  }

  return { showStep: showStep, showAnswer: showAnswer, showError: showError };
})();

// data-action 을 가진 것만 상태머신에 넘긴다.
// 도움바·질문칸·퀴즈 버튼은 data-action 이 없으므로 여기 안 걸린다.
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  if (!window.MissionEngine) return;   // 파일이 아직 없어도 페이지가 죽지 않게

  var action = el.getAttribute('data-action');
  var value = el.getAttribute('data-value');

  // 입력칸이 있는 단계는 버튼의 data-value 대신 입력칸 값을 쓴다.
  if (action === 'submit-account') {
    value = document.getElementById('input-account').value;
  } else if (action === 'submit-amount') {
    value = document.getElementById('input-amount').value;
  }

  var r = window.MissionEngine.submit({ action: action, value: value });

  if (r.ok) {
    window.BankUI.showAnswer('');
    if (action === 'restart') {
      document.getElementById('input-account').value = '';
      document.getElementById('input-amount').value = '';
    }
  } else {
    window.BankUI.showError(r.message, '#screen-' + r.step);
  }

  window.BankUI.showStep(r.step);
});

// data-goto — 미션 판정과 무관한 순수 화면 전환(intro → home). MissionEngine 을 부르지 않는다.
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-goto]');
  if (!el) return;
  window.BankUI.showStep(el.getAttribute('data-goto'));
});

document.addEventListener('click', function (e) {
  var key = e.target.closest('[data-key]');
  if (!key) return;
  var pad = key.closest('.keypad');
  if (!pad) return;

  var input = document.getElementById(pad.getAttribute('data-target'));
  if (!input) return;

  var k = key.getAttribute('data-key');
  var raw = input.value.replace(/[^0-9]/g, '');
  if (k === 'clear') raw = '';
  else if (k === 'back') raw = raw.slice(0, -1);
  else raw = raw + k;

  // 금액칸만 천 단위 쉼표로 보여준다. 판정은 숫자만 남겨서 비교하므로 쉼표는 무관하다.
  input.value = (pad.getAttribute('data-target') === 'input-amount' && raw)
    ? Number(raw).toLocaleString('ko-KR')
    : raw;
});
</script>

<script src="../shared/llm-config.js"></script>
<script src="../mission/mission-engine.js"></script>
<script src="../guide/voice.js"></script>
<script src="../guide/ai-guide.js"></script>
<script src="../mission/quiz.js"></script>
<script>
// missions.json 이 아직 fetch 중이면 로딩 문구가 잠깐 보인다 — 로드되면 다시 그려서 없앤다.
(function retryIntro() {
  window.BankUI.showStep('intro');
  if (window.MissionEngine && !window.MissionEngine.isLoaded()) {
    setTimeout(retryIntro, 50);
  }
})();
</script>
</body>
</html>
